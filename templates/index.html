<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{{ name }}'s Watchlist</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" type="text/css">
    <link rel="icon" href="{{ url_for('static', filename='shushu1.jpg') }}">
</head>
<body>
    <h2>
        <img alt="Avatar" src="{{ url_for('static', filename='images/shushu1.jpg') }}">
        {{ name }}'s Watchlist
    </h2>

    <p>{{ movies|length }} Titles</p>

    <ul class="movie-list">
        {% for movie in movies %}
            <li>{{ movie.title }} - {{ movie.year }}</li>
        {% endfor %}
    </ul>

    <footer>
        <small>&copy; 2025 <a href="http://helloflask.com/book/3">HelloFlask</a></small>
    </footer>
    <img alt="Walking Totoro" class="totoro" src="http://helloflask.com/totoro.gif">
    
    

    <img alt="Walking Totoro" src="{{ url_for('static', filename='images/shushu1.jpg') }}">
</body>
</html>
